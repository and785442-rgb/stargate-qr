<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StarGate QR</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#111;color:#fff;font-family:Arial,sans-serif}
.card{width:min(94vw,430px);background:#1b1b1b;border-radius:22px;padding:24px;text-align:center;box-shadow:0 12px 40px #0008}
h1{margin:0 0 6px;font-size:30px}
.star{color:#fff}.gate{color:#ff8a00}
p{color:#aaa;margin:8px 0 18px}
#camera{width:100%;aspect-ratio:4/3;object-fit:cover;background:#000;border-radius:16px}
#status{min-height:42px;margin-top:14px;color:#ff9d2e;font-size:14px}
button{border:0;border-radius:12px;padding:12px 18px;background:#ff8a00;color:#111;font-weight:bold;cursor:pointer;margin:5px}
#start{display:none}
.note{font-size:12px;color:#666;margin-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>✨ <span class="star">Star</span><span class="gate">Gate</span></h1>
  <p>Scanner QR StarPass</p>
  <video id="camera" playsinline autoplay muted></video>
  <div id="status">Préparation de la caméra…</div>
  <button id="start">Activer la caméra</button>
  <div class="note">Le scan est effectué directement dans le navigateur.</div>
</div>

<script>
const video=document.getElementById("camera");
const status=document.getElementById("status");
const startBtn=document.getElementById("start");
let stream=null, timer=null, busy=false;

function msg(t, cls=""){status.textContent=t;status.style.color=cls==="ok"?"#55d66b":cls==="err"?"#ff5555":"#ff9d2e";}

function validStarPass(text){
  try{
    const u=new URL(text);
    return (u.protocol==="http:"||u.protocol==="https:") &&
           u.pathname==="/login" &&
           u.searchParams.has("username") &&
           u.searchParams.has("password");
  }catch(e){return false;}
}

async function openLogin(text){
  if(busy)return;
  if(!validStarPass(text)){msg("QR non reconnu : utilise un QR StarPass.","err");return;}
  busy=true;
  msg("QR StarPass reconnu. Connexion…","ok");
  if(stream) stream.getTracks().forEach(t=>t.stop());
  if(timer) clearInterval(timer);
  location.href=new URL(text).toString();
}

async function scan(){
  if(!("BarcodeDetector" in window)){
    msg("Ce navigateur ne prend pas en charge le scan QR natif. Essaie Chrome sur Android.","err");
    startBtn.style.display="inline-block";
    return;
  }

  let detector;
  try{
    detector=new BarcodeDetector({formats:["qr_code"]});
  }catch(e){
    msg("Le scanner QR natif n'est pas disponible sur ce navigateur.","err");
    startBtn.style.display="inline-block";
    return;
  }

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:"environment"}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    msg("Présente le QR StarPass devant la caméra.");

    timer=setInterval(async()=>{
      if(busy || video.readyState<2)return;
      try{
        const codes=await detector.detect(video);
        if(codes.length && codes[0].rawValue) await openLogin(codes[0].rawValue);
      }catch(e){}
    },250);
  }catch(e){
    msg("Caméra refusée ou indisponible. Autorise la caméra puis réessaie.","err");
    startBtn.style.display="inline-block";
  }
}

startBtn.onclick=()=>{
  startBtn.style.display="none";
  scan();
};

window.addEventListener("load",scan);
</script>
</body>
</html>
